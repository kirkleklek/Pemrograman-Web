user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance & File Transfer
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Body & Buffer Settings (Accommodates LMS file and assignment uploads)
    client_max_body_size 64M;
    client_body_buffer_size 128k;

    # Gzip Compression Settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ==========================================================================
    # HTTP Server Block (Port 80): Redirects to HTTPS, exposes Healthcheck
    # ==========================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Document Root
        root /var/www/html/public;

        # Laravel 12 Health Route (/up) - Directly accessible for Docker/orchestrator healthcheck
        location = /up {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            include fastcgi_params;
            access_log off;
        }

        # Block access to hidden files (.env, .git, etc.) with 403 Forbidden
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Let's Encrypt ACME challenge verification
        location /.well-known/acme-challenge/ {
            root /var/www/html/public;
            allow all;
        }

        # Redirect all standard HTTP requests to HTTPS (Port 443)
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # HTTPS Server Block (Port 443): Production SSL/TLS Web Server
    # ==========================================================================
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name kampuslms.local _;

        # Document Root WAJIB mengarah ke /public aplikasi Laravel
        root /var/www/html/public;
        index index.php index.html;

        # SSL / TLS Certificate and Key
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern TLS Security Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        charset utf-8;

        # 1. Laravel 12 Health Route (/up)
        location = /up {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            include fastcgi_params;
            access_log off;
        }

        # 2. Vite Compiled Assets (/build/) with Long-term Cache Headers
        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # 3. Livewire 3.8 Endpoints (/livewire/*)
        location ^~ /livewire/ {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # 4. General Static Assets (Images, fonts, favicons)
        location ~* \.(ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
            expires 6M;
            add_header Cache-Control "public, max-age=15552000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # 5. Strict Hidden Files Protection (Block .env, .git, etc.)
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }

        # 6. Primary Laravel Front Controller Routing
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # 7. PHP-FPM FastCGI Handler
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }
}

